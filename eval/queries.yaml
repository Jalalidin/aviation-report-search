# Task A - ad-hoc search, known-item version.
#
# Each entry is one target report (NTSB event id) and three queries an engineer might type
# to find it:
#   kw  terse technical keywords
#   nl  a natural-language question
#   mm  vocabulary mismatch: lay or alternative wording that avoids the report's own terms
#
# Targets were sampled with a fixed seed (40 from reports with an aircraft system/component
# finding, 20 operational), then reports too generic to be found by description were dropped.
# The queries were written by an AI model (Claude) from the report's analysis text - not by a
# domain expert. Only the target is counted as relevant, so absolute scores are pessimistic:
# other reports can be just as good an answer. Use this to compare arms, not as final truth.

