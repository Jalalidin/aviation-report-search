[project]
name = "avsearch"
version = "0.1.0"
description = "Search and retrieval-evaluation prototype for aviation accident reports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "sentence-transformers>=3",
    "ranx>=0.3.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.scripts]
avsearch = "avsearch.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
